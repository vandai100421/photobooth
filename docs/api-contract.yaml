          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HolidayCreate:
      type: object
      required: [name, date]
      properties:
        name:
          type: string
        date:
          type: string
          pattern: '^\d{2}-\d{2}$'
        is_recurring:
          type: boolean
          default: true
        specific_year:
          type: integer
        template_id:
          type: string
          format: uuid
    HolidayUpdate:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
          pattern: '^\d{2}-\d{2}$'
        is_recurring:
          type: boolean
        specific_year:
          type: integer
        template_id:
          type: string
          format: uuid
        is_active:
          type: boolean

    # --- MessageTemplate ----------------------------------------------------
    MessageTemplate:
      type: object
      description: Reusable message body with `{{variable}}` placeholders.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        occasion:
          type: string
          enum: [birthday, tet, giangsinh, 8_3, 20_10, valentine, promo, welcome, custom]
        channel:
          type: string
          enum: [zalo, email, sms]
        subject:
          type: string
          nullable: true
          description: Required for email channel.
        body:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TemplateCreate:
      type: object
      required: [name, occasion, channel, body]
      properties:
        name:
          type: string
        occasion:
          type: string
          enum: [birthday, tet, giangsinh, 8_3, 20_10, valentine, promo, welcome, custom]
        channel:
          type: string
          enum: [zalo, email, sms]
        subject:
          type: string
        body:
          type: string
    TemplateUpdate:
      type: object
      properties:
        name:
          type: string
        occasion:
          type: string
          enum: [birthday, tet, giangsinh, 8_3, 20_10, valentine, promo, welcome, custom]
        channel:
          type: string
          enum: [zalo, email, sms]
        subject:
          type: string
        body:
          type: string
        is_active:
          type: boolean

    # --- MessageLog ---------------------------------------------------------
    MessageLog:
      type: object
      description: Audit trail entry for a sent/attempted message (append-only).
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
          nullable: true
        voucher_id:
          type: string
          format: uuid
          nullable: true
        channel:
          type: string
          enum: [zalo, email, sms]
        status:
          type: string
          enum: [pending, sent, failed, delivered]
        content_sent:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # --- Message request bodies --------------------------------------------
    SendMessageRequest:
      type: object
      required: [customer_id, template_id]
      properties:
        customer_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [zalo, email, sms]
          description: Overrides the template channel if provided.
        voucher_id:
          type: string
          format: uuid
          description: If provided, issues a customer_voucher and fills {{voucher_code}}.
    ScheduleMessageRequest:
      type: object
      required: [customer_id, template_id, scheduled_at]
      properties:
        customer_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        channel:
          type: string
          enum: [zalo, email, sms]
        voucher_id:
          type: string
          format: uuid

    # --- MessageStats -------------------------------------------------------
    MessageStats:
      type: object
      properties:
        total:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        delivered:
          type: integer
        pending:
          type: integer
        by_channel:
          type: object
          additionalProperties:
            type: integer
          description: Count per channel (zalo, email, sms).

    # --- DashboardStats -----------------------------------------------------
    DashboardStats:
      type: object
      properties:
        customers_today:
          type: integer
        bookings_today:
          type: integer
        vouchers_used_today:
          type: integer
        revenue_today:
          type: number
          format: double
        customers_total:
          type: integer
        bookings_total:
          type: integer
        vouchers_active:
          type: integer

    # --- Setting ------------------------------------------------------------
    Setting:
      type: object
      description: Application key/value setting.
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: shop_name
        value:
          type: string
          nullable: true
          example: TAP Photobooth
        description:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time

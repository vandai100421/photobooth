    get:
      tags: [Messages]
      summary: List scheduled (pending) messages
      description: Returns `message_logs` with `status=pending` and a future `scheduled_at`.
      x-required-roles: [admin, manager, staff]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: from

                          $ref: '#/components/schemas/Setting'
              example:
                success: true
                data:
                  - id: fff0e840-e29b-41d4-a716-446655440080
                    key: shop_name
                    value: TAP Photobooth
                    description: Display name of the photobooth shop
                    updated_at: '2024-01-15T08:00:00Z'
                  - key: zalo_oa_id
                    value: '1234567890'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags: [Settings]
      summary: Update application settings
      description: |
        Bulk upsert. Body is a flat map of `{ key: value }`. Admin only.
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Map of setting key to value.
              additionalProperties:
                type: string
              example:
                shop_name: TAP Photobooth Premium

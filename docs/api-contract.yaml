        '401':
          $ref: '#/components/responses/UnauthorizedError'

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use `Authorization: Bearer <token>` where `<token>` is the JWT
        returned by `POST /auth/login` or `POST /auth/refresh`.

  # ---------------------------------------------------------------------------
  # Reusable parameters
  # ---------------------------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (1-indexed).
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      description: Items per page (max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchParam:
      name: search
      in: query
      description: Free-text search term.
      schema:
        type: string
    SortParam:
      name: sort
      in: query
      description: Sort order, e.g. `created_at:desc`.
      schema:
        type: string
        pattern: '^[a-z_]+:(asc|desc)$'
        example: created_at:desc
    IdParam:
      name: id
      in: path
      required: true
      description: Resource UUID.
      schema:
        type: string
        format: uuid

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    ValidationError:
      description: Request validation failed (zod schema mismatch).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'Validation failed: email must be a valid email address'
    UnauthorizedError:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'Unauthorized: missing or invalid token'
    ForbiddenError:
      description: Authenticated but lacking the required role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: 'Forbidden: insufficient role'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Resource not found

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Generic wrappers ---------------------------------------------------
    SuccessResponse:
      type: object
      description: Base success envelope.
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload (varies per endpoint).
    PaginatedResponse:
      type: object
      description: Base paginated success envelope.
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Array of items (varies per endpoint).
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
    ErrorResponse:
      type: object
      description: Standard error envelope.
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Something went wrong
    Pagination:
      type: object
      description: Pagination metadata.
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 134
        totalPages:
          type: integer
          example: 7

    # --- Employee -----------------------------------------------------------
    Employee:

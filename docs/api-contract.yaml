        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          schema:
            type: string
            enum: [zalo, email, sms]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, sent, failed, delivered]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':

  /messages/send-now:
    post:
      tags: [Messages]
      summary: Send a message immediately
      description: |
        Renders the template, sends via the chosen channel (default = template
        channel), creates a `message_log` with status `sent`/`failed`.
        If `voucher_id` is provided, a `customer_voucher` is issued first and
        the `{{voucher_code}}` placeholder is populated.
      x-required-roles: [admin, manager, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              customer_id: 880e8400-e29b-41d4-a716-446655440020
              template_id: dde0e840-e29b-41d4-a716-446655440060
              channel: zalo
      responses:
        '201':
          description: Message send attempt recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageLog'
              example:
                success: true
                data:
                  id: eef0e840-e29b-41d4-a716-446655440070
                  customer_id: 880e8400-e29b-41d4-a716-446655440020
                  template_id: dde0e840-e29b-41d4-a716-446655440060
                  channel: zalo
                  status: sent
                  sent_at: '2024-08-12T08:00:05Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'


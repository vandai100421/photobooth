      summary: Schedule a message
      description: Creates a `message_log` with `status=pending` and the given `scheduled_at`. The cron scheduler picks it up when due.
      x-required-roles: [admin, manager, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleMessageRequest'
            example:
              customer_id: 880e8400-e29b-41d4-a716-446655440020
              template_id: dde0e840-e29b-41d4-a716-446655440060
              scheduled_at: '2024-08-12T08:00:00Z'
              channel: zalo
              voucher_id: 990e8400-e29b-41d4-a716-446655440030
      responses:

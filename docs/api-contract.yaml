              booking_date: '2024-08-12T14:30:00Z'
              package_name: Premium Album
              amount: 350000
              voucher_id: 990e8400-e29b-41d4-a716-446655440099
              photo_count: 12
              notes: Anniversary session
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /bookings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

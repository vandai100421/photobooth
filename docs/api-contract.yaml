      tags: [Bookings]
      summary: Get a booking by id
      x-required-roles: [admin, manager, staff]
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Bookings]
      summary: Update a booking
      description: |
        Changing status to/from `completed` adjusts customer stats via the
        `update_customer_stats_on_booking` trigger.
      x-required-roles: [admin, manager, staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdate'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Bookings]
      summary: Cancel a booking
      description: |
        Sets booking `status` to `cancelled`. Does not hard-delete the record.
        If the booking was `completed`, the customer stats trigger reverts
